# Keeps the free Render site awake during school hours so it opens instantly.
# Times are UTC. Philippine time (UTC+8) Mon–Fri 6:00 AM – 6:00 PM = UTC Sun–Thu 22:00–23:59 and Mon–Fri 00:00–09:59.
# To change the hours, edit the two cron lines below. To turn it off, disable this workflow in the repo's Actions tab.
name: Keep site awake
on:
  schedule:
    - cron: '*/5 22-23 * * 0-4'
    - cron: '*/5 0-9 * * 1-5'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://wonder-wall.onrender.com/healthz
