<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wonder Wall</title><link rel="stylesheet" href="/style.css">
<style>
  body { background: #fdfcf7 radial-gradient(#e7e1cf 1px, transparent 1px) 0 0 / 22px 22px; min-height: 100vh; }
  header { display: flex; gap: 1.2em; padding: 1em 1.4em; align-items: flex-start; }
  header .info { flex: 1; min-width: 0; }
  header h1 { font-size: 2rem; }
  header .prompt { font-size: 1.25rem; color: #4b5563; }
  .toolbar { margin-top: .8em; }
  .toolbar button, .toolbar .btn { padding: .45em .9em; font-size: .95rem; }
  .qr { background: #fff; border-radius: 16px; padding: 12px; text-align: center; box-shadow: 0 4px 18px rgba(0,0,0,.1); }
  .qr img { width: 190px; height: 190px; display: block; }
  .qr .code { font-size: 1.7rem; font-weight: 800; letter-spacing: .15em; color: var(--brand); }
  .qr .link { font-size: .8rem; color: var(--muted); max-width: 190px; word-break: break-all; }
  .closed-banner { background: #fef3c7; color: #92400e; font-weight: 700; padding: .4em .8em; border-radius: 8px; display: inline-block; }
  #board { position: relative; margin: 0 1em 2em; min-height: 60vh; }
  #count { font-weight: 700; }
  .big-qr { position: fixed; inset: 0; background: rgba(255,255,255,.97); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; gap: 1em; }
  .big-qr img { width: min(70vh, 80vw); height: min(70vh, 80vw); }
  .big-qr .code { font-size: 3rem; font-weight: 800; letter-spacing: .2em; color: var(--brand); }
</style></head>
<body>
<header>
  <div class="info">
    <h1 id="title">…</h1>
    <div class="prompt" id="promptEl"></div>
    <div class="toolbar row no-print">
      <a class="btn secondary" href="/">← All walls</a>
      <button id="toggleOpen" class="secondary"></button>
      <button id="toggleQr" class="secondary">Hide QR</button>
      <button id="bigQr" class="secondary">Big QR</button>
      <button id="full" class="secondary">Full screen</button>
      <button id="saveImg" class="secondary">🖼 Save image</button>
      <button id="printBtn" class="secondary">🖨 Print / Save PDF</button>
      <a id="export" class="btn secondary">💾 Download</a>
      <button id="newWall">➕ New wall</button>
    </div>
    <p class="muted"><span id="count">0</span> notes <span id="liveDot" class="no-print" style="margin-left:.8em;font-weight:600"></span> <span id="closedEl" class="closed-banner" hidden>Posting is closed</span></p>
  </div>
  <div class="qr" id="qrBox">
    <div class="muted" style="font-weight:600">Scan to post</div>
    <img id="qrImg" alt="QR code to join">
    <div class="code" id="code"></div>
    <div class="link" id="link"></div>
  </div>
</header>
<div id="board"></div>
<div class="big-qr no-print" id="bigBox" hidden>
  <h1 id="bigTitle"></h1>
  <img id="bigImg" alt="QR code to join">
  <div class="muted" id="bigLink"></div>
  <div class="code" id="bigCode"></div>
  <button id="closeBig">Close</button>
</div>
<script>
const CODE = location.pathname.split('/').pop();
const W = 200, H = 175, GAP = 18;
let wall, notes = [];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tilt = (id) => ((parseInt(id.slice(0, 4), 16) % 7) - 3) + 'deg';

function renderHeader() {
  document.title = wall.title + ' · Wonder Wall';
  title.textContent = bigTitle.textContent = wall.title;
  promptEl.textContent = wall.prompt || '';
  code.textContent = bigCode.textContent = wall.code;
  link.textContent = bigLink.textContent = wall.joinUrl;
  qrImg.src = bigImg.src = `/api/walls/${CODE}/qr.svg`;
  toggleOpen.textContent = wall.open ? '🔒 Close posting' : '🔓 Open posting';
  closedEl.hidden = wall.open;
  exportBtn.href = `/api/walls/${CODE}/export`;
}
const exportBtn = document.getElementById('export');

function noteEl(n) {
  const el = document.createElement('div');
  el.className = 'note';
  el.dataset.id = n.id;
  el.style.background = n.color;
  el.style.setProperty('--tilt', tilt(n.id));
  el.innerHTML = (n.drawing ? `<img src="${n.drawing}" alt="drawing">` : '') +
    (n.text ? `<div class="text">${esc(n.text)}</div>` : '') +
    (n.name ? `<div class="who">— ${esc(n.name)}</div>` : '') +
    `<button class="del no-print" title="Remove note">✕</button>`;
  el.querySelector('.del').onclick = async (e) => {
    e.stopPropagation();
    if (confirm('Remove this note?')) await fetch(`/api/walls/${CODE}/notes/${n.id}`, { method: 'DELETE' });
  };
  enableDrag(el, n);
  return el;
}

// Notes the teacher hasn't moved are laid out in a grid; moved notes keep their spot.
function layout() {
  const width = board.clientWidth;
  const cols = Math.max(1, Math.floor((width + GAP) / (W + GAP)));
  let slot = 0, maxBottom = 0;
  for (const n of notes) {
    const el = board.querySelector(`[data-id="${n.id}"]`);
    if (!el) continue;
    let left, top;
    if (n.x == null) {
      left = (slot % cols) * (W + GAP); top = Math.floor(slot / cols) * (H + GAP); slot++;
    } else { left = n.x * Math.max(0, width - W); top = n.y; }
    el.style.left = left + 'px'; el.style.top = top + 'px';
    maxBottom = Math.max(maxBottom, top + el.offsetHeight);
  }
  board.style.height = (maxBottom + 40) + 'px';
  count.textContent = notes.length;
}

function enableDrag(el, n) {
  el.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.del')) return;
    el.setPointerCapture(e.pointerId);
    const startX = e.clientX, startY = e.clientY;
    const ox = el.offsetLeft, oy = el.offsetTop;
    let moved = false;
    const move = (ev) => {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
      el.style.left = Math.max(0, Math.min(board.clientWidth - W, ox + dx)) + 'px';
      el.style.top = Math.max(0, oy + dy) + 'px';
    };
    const up = () => {
      el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up);
      if (!moved) { // a tap: select the note so the delete button shows (works on touch screens)
        const was = el.classList.contains('selected');
        board.querySelectorAll('.note.selected').forEach((x) => x.classList.remove('selected'));
        if (!was) el.classList.add('selected');
        return;
      }
      n.x = el.offsetLeft / Math.max(1, board.clientWidth - W); n.y = el.offsetTop;
      fetch(`/api/walls/${CODE}/notes/${n.id}`, { method: 'PATCH', body: JSON.stringify({ x: n.x, y: n.y }) });
      layout();
    };
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up);
  });
}

function addNote(n) {
  if (notes.some((x) => x.id === n.id)) return;
  notes.push(n);
  board.appendChild(noteEl(n));
  const img = board.querySelector(`[data-id="${n.id}"] img`);
  if (img) img.onload = layout;
  layout();
}

function removeNote(id) {
  notes = notes.filter((n) => n.id !== id);
  board.querySelector(`[data-id="${id}"]`)?.remove();
}

// Bring the screen up to date with the server: adds notes that arrived while the
// connection was down, removes deleted ones and applies moves.
async function resync() {
  const r = await fetch('/api/walls/' + CODE, { cache: 'no-store' });
  if (!r.ok) throw new Error('resync failed');
  const fresh = await r.json();
  Object.assign(wall, fresh, { notes: undefined }); renderHeader();
  const ids = new Set(fresh.notes.map((n) => n.id));
  notes.filter((n) => !ids.has(n.id)).forEach((n) => removeNote(n.id));
  for (const f of fresh.notes) {
    const n = notes.find((x) => x.id === f.id);
    if (n) { n.x = f.x; n.y = f.y; } else addNote(f);
  }
  layout();
}

function setLive(ok) {
  liveDot.textContent = ok ? '● Live' : '● Reconnecting…';
  liveDot.style.color = ok ? '#16a34a' : '#d97706';
}

// Live connection that heals itself: the browser retries short drops on its own; if the
// connection closes for good (e.g. the server restarted), we reconnect ourselves.
let es, firstOpen = true, retry = 1000;
function connect() {
  es = new EventSource(`/api/walls/${CODE}/events`);
  es.onopen = () => {
    setLive(true); retry = 1000;
    if (firstOpen) { firstOpen = false; return; }
    resync().catch(() => {});
  };
  es.onerror = () => {
    setLive(false);
    if (es.readyState === EventSource.CLOSED) {
      setTimeout(connect, retry); retry = Math.min(retry * 2, 15000);
    }
  };
  es.addEventListener('note', (e) => addNote(JSON.parse(e.data)));
  es.addEventListener('remove', (e) => { removeNote(JSON.parse(e.data).id); layout(); });
  es.addEventListener('move', (e) => {
    const m = JSON.parse(e.data), n = notes.find((x) => x.id === m.id);
    if (n) { n.x = m.x; n.y = m.y; layout(); }
  });
  es.addEventListener('wall', (e) => { Object.assign(wall, JSON.parse(e.data)); renderHeader(); });
}

async function init() {
  const r = await fetch('/api/walls/' + CODE);
  if (!r.ok) { document.body.innerHTML = '<div class="wrap"><h1>Wall not found</h1><a href="/">Back</a></div>'; return; }
  wall = await r.json();
  renderHeader();
  wall.notes.forEach(addNote);
  connect();
  // Safety net: catch up when the laptop wakes up / the tab comes back, and every 2 minutes.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) resync().catch(() => {}); });
  setInterval(() => resync().catch(() => {}), 2 * 60 * 1000);
}

toggleOpen.onclick = async () => {
  const r = await fetch('/api/walls/' + CODE, { method: 'PATCH', body: JSON.stringify({ open: !wall.open }) });
  Object.assign(wall, await r.json()); renderHeader();
};
toggleQr.onclick = () => { qrBox.hidden = !qrBox.hidden; toggleQr.textContent = qrBox.hidden ? 'Show QR' : 'Hide QR'; layout(); };
bigQr.onclick = () => { bigBox.hidden = false; };
closeBig.onclick = () => { bigBox.hidden = true; };
full.onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
printBtn.onclick = () => window.print();
newWall.onclick = () => { location.href = '/'; };

// ---- Save the whole wall as one PNG picture ----
const loadImg = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
function wrapLines(ctx, text, maxW) {
  const lines = [];
  for (const para of text.split('\n')) {
    let line = '';
    for (const word of para.split(/(\s+)/)) {
      // long words / CJK text without spaces: break by character
      for (const piece of ctx.measureText(word).width > maxW ? [...word] : [word]) {
        if (ctx.measureText(line + piece).width > maxW && line.trim()) { lines.push(line.trim()); line = piece.trimStart(); }
        else line += piece;
      }
    }
    lines.push(line.trim());
  }
  return lines;
}
async function saveImage() {
  saveImg.disabled = true; saveImg.textContent = 'Saving…';
  try {
    const font = getComputedStyle(document.body).fontFamily;
    const pad = 40, headH = wall.prompt ? 120 : 80;
    // crop to the notes and the title instead of the full screen width
    const els = [...board.querySelectorAll('.note')];
    const m = document.createElement('canvas').getContext('2d');
    m.font = `bold 34px ${font}`; let textW = m.measureText(wall.title).width;
    m.font = `22px ${font}`; textW = Math.max(textW, m.measureText(wall.prompt || '').width);
    const boardW = Math.max(W, textW, ...els.map((e) => e.offsetLeft + e.offsetWidth + 10));
    const boardH = Math.max(H, ...els.map((e) => e.offsetTop + e.offsetHeight + 10));
    const scale = 2;
    const c = document.createElement('canvas');
    c.width = (boardW + pad * 2) * scale; c.height = (boardH + headH + pad * 2) * scale;
    const ctx = c.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#fdfcf7'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#1f2937'; ctx.font = `bold 34px ${font}`; ctx.textBaseline = 'top';
    ctx.fillText(wall.title, pad, pad);
    if (wall.prompt) { ctx.fillStyle = '#4b5563'; ctx.font = `22px ${font}`; ctx.fillText(wall.prompt, pad, pad + 48); }
    ctx.fillStyle = '#9ca3af'; ctx.font = `15px ${font}`;
    ctx.fillText(`${notes.length} notes · ${new Date().toLocaleDateString()}`, pad, pad + (wall.prompt ? 84 : 48));
    const top0 = pad + headH;
    for (const n of notes) {
      const el = board.querySelector(`[data-id="${n.id}"]`);
      if (!el) continue;
      const x = pad + el.offsetLeft, y = top0 + el.offsetTop, w = el.offsetWidth, h = el.offsetHeight;
      ctx.save();
      ctx.translate(x + w / 2, y + h / 2); ctx.rotate(parseFloat(tilt(n.id)) * Math.PI / 180); ctx.translate(-w / 2, -h / 2);
      ctx.shadowColor = 'rgba(0,0,0,.18)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 5;
      ctx.fillStyle = n.color; ctx.fillRect(0, 0, w, h);
      ctx.shadowColor = 'transparent';
      let cy = 14;
      if (n.drawing) {
        const img = await loadImg(n.drawing);
        if (img) { const iw = w - 28; ctx.drawImage(img, 14, cy, iw, iw * img.height / img.width); cy += iw * img.height / img.width + 6; }
      }
      if (n.text) {
        ctx.fillStyle = '#1f2937'; ctx.font = `17px ${font}`;
        for (const line of wrapLines(ctx, n.text, w - 28)) { ctx.fillText(line, 14, cy); cy += 23; }
      }
      if (n.name) { ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.font = `bold 12px ${font}`; ctx.fillText('— ' + n.name, 14, h - 20); }
      ctx.restore();
    }
    const blob = await new Promise((ok) => c.toBlob(ok, 'image/png'));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `wonder-wall-${wall.title.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').slice(0, 40) || CODE}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) { alert('Could not save the image: ' + e.message); }
  saveImg.disabled = false; saveImg.textContent = '🖼 Save image';
}
saveImg.onclick = saveImage;
window.addEventListener('resize', layout);
// Tapping empty space clears the selection.
document.addEventListener('pointerdown', (e) => {
  if (!e.target.closest('.note')) board.querySelectorAll('.note.selected').forEach((x) => x.classList.remove('selected'));
});
init();
</script>
</body></html>
